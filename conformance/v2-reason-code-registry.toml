# Published V2 protocol reason-code registry.
#
# Generated by `cargo run -p csv-sdk --example generate_portable_conformance`.
# Never hand-edited. Each identifier is produced by the owning crate's own
# `registry_id` function, so this file cannot name a code no code path emits.
#
# The portable conformance package may only declare expected reason codes
# that appear here; a mechanical gate enforces that in both directions.
#
# Disjoint from the V1 `ACCOUNTABILITY.*` registry published at
# csv-testkit/corpus/v1/reason-codes/registry.toml.

registry_version = 1
wire_version = 2

[[family]]
name = "dimension-assurance"
emitted_by = "csv-verifier"
prefix = "PROTOCOL."
codes = [
  "PROTOCOL.STRUCTURE.VALIDATED",
  "PROTOCOL.STRUCTURE.BUNDLE_TOO_LARGE",
  "PROTOCOL.STRUCTURE.DAG_INVALID",
